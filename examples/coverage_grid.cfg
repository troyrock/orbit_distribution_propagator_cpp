# Settings for distribution_coverage and tools/coverage_grid.py.
# Each CSV row supplies perigee altitude, inclination, eccentricity and sigmas.
# The coverage CLI fixes RAAN=20 deg, argument of perigee=30 deg, M=10 deg.
force_model = j2_j2sq
initial_type = osculating
output_type = mean
orbit_keplerian_deg = 8378137, 0, 45, 20, 30, 10
uncertainty_coordinates = rtn
sigma = 1000, 1000, 1000, 0.01, 0.01, 0.01
samples = 20000
seed = 20260919
threads = 8
# Used only with --fixed-times; automatic scans choose a phase-rate cadence.
duration_days = 60
output_step_days = 0.5
visual_samples = 0
phase_bins = 72
coverage_max_gap_deg = 5
coverage_occupied_fraction = 1
persistence = 3
# Geometric floor only; low-perigee tails are counted and explicitly reported.
minimum_altitude_m = 0
relative_tolerance = 1e-11
absolute_tolerance_m = 0.001
absolute_tolerance_elements = 1e-12
min_step_s = 0.001
max_step_s = 86400
max_memory_mb = 2048
accuracy_check = 0
