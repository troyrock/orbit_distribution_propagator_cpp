# Deliberately broad isotropic POSITION uncertainty for a visible ball->ribbon
# experiment. This is a demonstration, not a measured covariance for an object.
force_model = j2_j2sq
initial_type = osculating
output_type = osculating
orbit_keplerian_deg = 26560000, 0.02, 55, 20, 30, 10
uncertainty_coordinates = rtn
sigma = 100000, 100000, 100000, 1, 1, 1
samples = 5000
seed = 20260919
threads = 8
duration_days = 60
output_step_days = 0.5
visual_samples = 1500
phase_bins = 72
coverage_max_gap_deg = 5
coverage_occupied_fraction = 1
mixing_max_resultant = 0.05
mixing_max_tv = 0.15
persistence = 3
minimum_altitude_m = 1000000
relative_tolerance = 1e-11
absolute_tolerance_m = 0.001
absolute_tolerance_elements = 1e-12
min_step_s = 0.001
max_step_s = 86400
max_memory_mb = 2048
accuracy_check = 8
